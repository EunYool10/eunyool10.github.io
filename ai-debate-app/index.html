<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>10분 토론</title>
<style>
:root{--bg:#f6f6f4;--ink:#222;--muted:#6b6b66;--line:#dcdcd6}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--ink:#ececea;--muted:#a3a39d;--line:#3a3a37}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{max-width:420px;width:100%;text-align:center}
.name{font-size:14px;color:var(--muted);margin:0 0 14px}
h1{font-size:24px;font-weight:600;line-height:1.4;margin:0 0 16px;word-break:keep-all}
p{font-size:15px;line-height:1.7;color:var(--muted);margin:0;padding-top:16px;border-top:1px solid var(--line);word-break:keep-all}
</style>
</head>
<body>
<main>
<div class="name">10분 토론</div>
<h1>서비스가 종료된 웹입니다.</h1>
<p>더 이상 운영하지 않는 서비스입니다.<br>그동안 이용해 주셔서 감사합니다.</p>
</main>
</body>
</html>
